# Verificação contínua. Nada aqui publica artefato (quem publica é o
# release.yml, por tag).
#
# - `verificacao`, no Ubuntu: formato, análise, testes e código gerado.
# - `build-windows`, `build-android` e `build-macos`: compilam o código
#   nativo de cada plataforma. Existem porque `flutter test` roda só Dart e
#   nunca invoca o MSVC, o Gradle ou o Xcode — quebra de compilação nativa
#   passa pelos testes inteirinha, como já passou duas vezes no Windows (ATL
#   faltando e `just_audio_windows` contra o MSVC do Visual Studio 2026).
#
# A versão do Flutter é a mesma da máquina de referência documentada no README.
# Se atualizar o Flutter do projeto, atualize os três lugares juntos: os dois
# `flutter-version` daqui e a tabela do README.

name: CI

on:
  push:
    # Os ramos de rascunho do workflow "Gerar código" (gerar.yml) não são
    # trabalho a conferir: o que sai deles volta para o ramo de verdade.
    branches-ignore: ['gerar/**', 'gerado/**']
  pull_request:

# Push novo na mesma referência cancela a execução anterior, que já está
# obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Formato, análise, testes e ícones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      # Os três passos abaixo rodam mesmo se o anterior falhar, e cada falha
      # vira anotação no PR, no arquivo e na linha (tool/ci_anotacoes.py):
      # um push mostra tudo o que está errado, sem abrir o log.
      - name: Formatação
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format . > /dev/null
            python3 tool/ci_anotacoes.py formato
            git checkout -- .
            exit 1
          fi

      - name: Análise estática
        if: success() || failure()
        run: |
          if ! flutter analyze --fatal-infos; then
            dart analyze --format=machine > "$RUNNER_TEMP/analise.txt" 2>&1 || true
            python3 tool/ci_anotacoes.py analise "$RUNNER_TEMP/analise.txt"
            exit 1
          fi

      - name: Testes
        if: success() || failure()
        run: |
          status=0
          flutter test --file-reporter "json:$RUNNER_TEMP/testes.json" || status=$?
          python3 tool/ci_anotacoes.py testes "$RUNNER_TEMP/testes.json"
          exit $status

      # O código do banco local (`banco_local.g.dart`) é gerado das tabelas e
      # commitado. Gerar de novo é a verificação, como a dos ícones abaixo:
      # tabela mudada sem gerar de novo muda o arquivo, e o git acusa.
      - name: Código gerado do banco está atualizado
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/banco

          if [ -n "$(git status --porcelain -- lib/core/banco)" ]; then
            echo "::error title=Código do banco desatualizado::Rode 'dart run build_runner build' localmente e commite o resultado."
            echo
            echo "As tabelas em lib/core/banco/tabelas.dart não correspondem ao"
            echo "código gerado em lib/core/banco/banco_local.g.dart."
            echo
            echo "Para corrigir, na raiz do projeto:"
            echo
            echo "    dart run build_runner build"
            echo "    dart format lib/core/banco"
            echo "    git add lib/core/banco"
            echo
            git status --short -- lib/core/banco
            exit 1
          fi

      # Fecha a limitação do `app_icone_test.dart`: aquele teste pega .vec
      # faltando ou órfão, mas não pega .vec DESATUALIZADO — o arquivo existe,
      # só não corresponde mais ao desenho do SVG.
      #
      # Recompilar é a verificação. Se o .vec estava atualizado, o compilador
      # reescreve conteúdo idêntico e a árvore fica limpa. Se estava
      # desatualizado, o byte muda e o git acusa.
      #
      # A checagem olha apenas `assets/icons_vec/`, que é a única pasta que o
      # compilador toca. Assim nenhum arquivo mexido por outro passo (como o
      # `pubspec.lock`) derruba o CI por engano.
      - name: Ícones pré-compilados estão atualizados
        run: |
          dart run tool/compilar_icones.dart

          if [ -n "$(git status --porcelain -- assets/icons_vec)" ]; then
            echo "::error title=Ícones .vec desatualizados::Rode 'dart run tool/compilar_icones.dart' localmente e commite o resultado."
            echo
            echo "Os binários pré-compilados em assets/icons_vec/ não correspondem"
            echo "aos SVG de assets/icons/. Algum ícone foi adicionado, removido ou"
            echo "redesenhado sem recompilar."
            echo
            echo "Para corrigir, na raiz do projeto:"
            echo
            echo "    dart run tool/compilar_icones.dart"
            echo "    git add assets/icons_vec"
            echo "    git commit -m 'chore: recompila icones'"
            echo
            echo "Arquivos fora de sincronia:"
            git status --short -- assets/icons_vec
            echo
            git diff --stat -- assets/icons_vec
            exit 1
          fi

          echo "Os .vec correspondem aos SVG."

  build-windows:
    name: Build nativo do Windows
    # Voltou para a imagem corrente em 24/09/2026. Ela traz o Visual Studio
    # 2026 (MSVC 14.51), e é justamente disso que se precisa: o plugin que
    # não compilava lá, o `just_audio_windows`, saiu do projeto — quem toca
    # o WAV agora é o `audioplayers`, que pede C++20 e não usa o
    # `<experimental/coroutine>`. Fixar a imagem escondia a regressão em vez
    # de acusá-la.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # Deixa registrado no log qual Visual Studio a máquina usou. É a primeira
      # informação de que se precisa quando este job quebra sem o código ter
      # mudado.
      - name: Ambiente
        run: flutter doctor -v

      - name: Dependências
        run: flutter pub get

      # Compila o código nativo de verdade, com os plugins do Windows. Não
      # assina, não empacota e não sobe artefato: o resultado que interessa é
      # ter compilado.
      - name: Build do Windows
        run: flutter build windows

  build-android:
    name: Build nativo do Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      # Debug: compila o Gradle, o Kotlin e os plugins do Android sem
      # precisar da chave de release.
      - name: Build do Android
        run: flutter build apk --debug

  build-macos:
    name: Build nativo do macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Build do macOS
        run: flutter build macos --debug
