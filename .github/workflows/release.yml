# Publica uma versão do FONAR (US41): Windows, macOS e Android num release
# do GitHub, e a versão web (US42, a do iPhone) no GitHub Pages. A landing
# page aponta para o "latest" deste repositório, então o link de download não
# muda a cada versão:
#
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-Windows.zip
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-macOS.zip
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-Android.apk
#     https://fonar-project.github.io/fonar-app/
#
# A versão web exige o GitHub Pages ligado UMA vez, à mão: Settings > Pages >
# Source: GitHub Actions. Sem isso, só o job dela falha; o release sai igual.
# O `deploy-pages` desiste depois de 10 minutos (o máximo dele) se o Pages não
# terminar de publicar — aconteceu na v1.0.0, a primeira publicação. Aí, na
# execução: "Re-run failed jobs" (o pacote tem um nome por tentativa, para a
# re-execução não esbarrar no da anterior).
#
# Para publicar, na `main` atualizada:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# A versão do app (`--build-name`) é a da tag, sem o "v"; o número do build é
# o número desta execução.
#
# A chave do APK vem dos secrets FONAR_ANDROID_KEYSTORE_BASE64,
# FONAR_KEYSTORE_SENHA, FONAR_CHAVE_ALIAS e FONAR_CHAVE_SENHA (ver
# "Distribuição" no README). Sem eles, o APK sai com a chave de debug e o
# workflow avisa: serve para testar, não para distribuir — uma atualização
# assinada com outra chave não instala por cima.
#
# O Windows e o macOS saem sem assinatura de código (não há certificado
# nem conta de desenvolvedor da Apple): na primeira abertura, o Windows
# mostra o SmartScreen e o macOS pede para liberar em Ajustes > Privacidade e
# Segurança. A landing explica os dois.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSAO: 3.47.2

jobs:
  android:
    name: APK do Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Chave de release
        env:
          KEYSTORE_BASE64: ${{ secrets.FONAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fonar.jks"
            echo "FONAR_KEYSTORE=$RUNNER_TEMP/fonar.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=APK com a chave de debug::Os secrets da chave de release não estão no repositório (ver Distribuição no README). Este APK serve para testar, não para distribuir."
          fi

      - name: Build
        env:
          FONAR_KEYSTORE_SENHA: ${{ secrets.FONAR_KEYSTORE_SENHA }}
          FONAR_CHAVE_ALIAS: ${{ secrets.FONAR_CHAVE_ALIAS }}
          FONAR_CHAVE_SENHA: ${{ secrets.FONAR_CHAVE_SENHA }}
        run: |
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk FONAR-Android.apk

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: FONAR-Android.apk
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"

      # A pasta inteira do Release: o executável precisa das DLLs e de
      # `data/` ao lado dele. Dentro do zip, numa pasta FONAR.
      - name: Empacotar
        shell: pwsh
        run: |
          Copy-Item -Recurse build\windows\x64\runner\Release FONAR
          Compress-Archive -Path FONAR -DestinationPath FONAR-Windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: FONAR-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS (zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: |
          flutter build macos --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"

      # `ditto` guarda os atributos e os links do pacote .app; um zip comum
      # os perde e o app não abre.
      - name: Empacotar
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/FONAR.app FONAR-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: FONAR-macOS.zip
          if-no-files-found: error

  web:
    name: Versão web (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      # O SQLite em WebAssembly e o worker do banco, da release do drift que
      # o pubspec.lock fixou.
      - name: Banco local no navegador
        run: bash tool/preparar_web.sh

      # `--no-web-resources-cdn`: o CanvasKit sai junto, da mesma origem, e
      # o service worker o guarda para abrir sem internet. Do CDN, a página
      # não abriria offline.
      - name: Build
        run: |
          flutter build web --release \
            --base-href /fonar-app/ \
            --no-web-resources-cdn \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"
          python3 tool/lista_offline.py build/web

      - uses: actions/configure-pages@v6

      # Um nome por tentativa: re-executar o job sobe o pacote de novo, e o
      # deploy-pages recusa a execução com dois pacotes de mesmo nome (foi o
      # que aconteceu ao re-executar a v1.0.0).
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/web

      - id: publicar
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  release:
    name: Publicar o release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Um por um, pelo nome: baixar "todos" trazia junto o pacote da versão
      # web (o `github-pages`, quando o job dela terminava antes), que ia
      # parar no release como `artifact.tar`.
      - uses: actions/download-artifact@v7
        with:
          name: android
          path: arquivos

      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: arquivos

      - uses: actions/download-artifact@v7
        with:
          name: macos
          path: arquivos

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          ## Baixar

          | Sistema | Arquivo | Na primeira abertura |
          |---|---|---|
          | Windows 10 ou 11 | \`FONAR-Windows.zip\` | Descompacte e abra \`fonar_app.exe\`. O Windows pode mostrar "O Windows protegeu o computador": clique em **Mais informações** e em **Executar assim mesmo**. |
          | macOS | \`FONAR-macOS.zip\` | Descompacte e arraste o FONAR para Aplicativos. Na primeira abertura, o macOS bloqueia: abra **Ajustes > Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. |
          | Android | \`FONAR-Android.apk\` | Abra o arquivo no celular e permita instalar apps desta fonte. |
          | iPhone e iPad | — | Abra https://fonar-project.github.io/fonar-app/ no Safari e toque em **Compartilhar > Adicionar à Tela de Início**. Abra sempre pelo ícone. |

          O FONAR é ferramenta de apoio à decisão clínica e não emite diagnóstico.
          EOF
          gh release create "$GITHUB_REF_NAME" arquivos/* \
            --title "FONAR ${GITHUB_REF_NAME}" \
            --notes-file notas.md \
            --verify-tag
