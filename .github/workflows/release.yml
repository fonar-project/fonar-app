# Publica uma versão do FONAR para baixar (US41): Windows, macOS e Android,
# num release do GitHub. A landing page aponta para o "latest" deste
# repositório, então o link de download não muda a cada versão:
#
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-Windows.zip
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-macOS.zip
#     https://github.com/fonar-project/fonar-app/releases/latest/download/FONAR-Android.apk
#
# Para publicar, na `main` atualizada:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# A versão do app (`--build-name`) é a da tag, sem o "v"; o número do build é
# o número desta execução.
#
# A chave do APK vem dos secrets FONAR_ANDROID_KEYSTORE_BASE64,
# FONAR_KEYSTORE_SENHA, FONAR_CHAVE_ALIAS e FONAR_CHAVE_SENHA (ver
# "Distribuição" no README). Sem eles, o APK sai com a chave de debug e o
# workflow avisa: serve para testar, não para distribuir — uma atualização
# assinada com outra chave não instala por cima.
#
# O Windows e o macOS saem sem assinatura de código (não há certificado
# nem conta de desenvolvedor da Apple): na primeira abertura, o Windows
# mostra o SmartScreen e o macOS pede para liberar em Ajustes > Privacidade e
# Segurança. A landing explica os dois.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSAO: 3.47.2

jobs:
  android:
    name: APK do Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Chave de release
        env:
          KEYSTORE_BASE64: ${{ secrets.FONAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fonar.jks"
            echo "FONAR_KEYSTORE=$RUNNER_TEMP/fonar.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=APK com a chave de debug::Os secrets da chave de release não estão no repositório (ver Distribuição no README). Este APK serve para testar, não para distribuir."
          fi

      - name: Build
        env:
          FONAR_KEYSTORE_SENHA: ${{ secrets.FONAR_KEYSTORE_SENHA }}
          FONAR_CHAVE_ALIAS: ${{ secrets.FONAR_CHAVE_ALIAS }}
          FONAR_CHAVE_SENHA: ${{ secrets.FONAR_CHAVE_SENHA }}
        run: |
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk FONAR-Android.apk

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: FONAR-Android.apk
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"

      # A pasta inteira do Release: o executável precisa das DLLs e de
      # `data/` ao lado dele. Dentro do zip, numa pasta FONAR.
      - name: Empacotar
        shell: pwsh
        run: |
          Copy-Item -Recurse build\windows\x64\runner\Release FONAR
          Compress-Archive -Path FONAR -DestinationPath FONAR-Windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: FONAR-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS (zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: |
          flutter build macos --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "${{ github.run_number }}" \
            --dart-define=FONAR_VERSAO="${GITHUB_REF_NAME}"

      # `ditto` guarda os atributos e os links do pacote .app; um zip comum
      # os perde e o app não abre.
      - name: Empacotar
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/FONAR.app FONAR-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: FONAR-macOS.zip
          if-no-files-found: error

  release:
    name: Publicar o release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: arquivos
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          ## Baixar

          | Sistema | Arquivo | Na primeira abertura |
          |---|---|---|
          | Windows 10 ou 11 | \`FONAR-Windows.zip\` | Descompacte e abra \`fonar_app.exe\`. O Windows pode mostrar "O Windows protegeu o computador": clique em **Mais informações** e em **Executar assim mesmo**. |
          | macOS | \`FONAR-macOS.zip\` | Descompacte e arraste o FONAR para Aplicativos. Na primeira abertura, o macOS bloqueia: abra **Ajustes > Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. |
          | Android | \`FONAR-Android.apk\` | Abra o arquivo no celular e permita instalar apps desta fonte. |
          | iPhone e iPad | — | Pela versão web, no Safari: **Compartilhar > Adicionar à Tela de Início**. |

          O FONAR é ferramenta de apoio à decisão clínica e não emite diagnóstico.
          EOF
          gh release create "$GITHUB_REF_NAME" arquivos/* \
            --title "FONAR ${GITHUB_REF_NAME}" \
            --notes-file notas.md \
            --verify-tag
