name: fonar_app
description: "FONAR — plataforma de avaliação vocal clínica para fonoaudiólogos."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3

  # Estado da interface de rede, para o indicador de conexão e para o login.
  #
  # Escolhido por cobrir as DUAS plataformas do projeto com o mesmo código:
  # o pubspec do pacote declara `android` e `windows` entre os plugins, junto
  # de iOS, Linux, macOS e web. Foi o critério de escolha — as alternativas
  # comuns (internet_connection_checker e afins) ou não declaram Windows ou
  # dependem de requisição HTTP de sondagem, que gasta dados do celular do
  # profissional sem responder nada que a fila de sincronização já não saiba.
  #
  # LIMITE, documentado também em `lib/core/network/conexao.dart`: ele informa
  # QUE INTERFACE existe, não que ela alcança a internet. Wi-Fi de consultório
  # atrás de portal cativo aparece como conectado e não chega à API.
  connectivity_plus: ^7.3.1

  # Captura de áudio. É o pacote que a stack do projeto já prevê (CLAUDE.md).
  #
  # Escolhido por três motivos: declara Android e Windows; deixa DESLIGAR
  # ganho automático, supressão de ruído e cancelamento de eco, e escolher a
  # fonte de áudio do Android — exigência da regra de captura; e avisa, pelo
  # `setOnConfigChanged`, quando o aparelho troca a taxa ou os canais pedidos.
  #
  # NÃO é biblioteca de análise: não calcula nenhuma medida. A única leitura
  # usada é o nível (amplitude), para o medidor e a aferição de ruído — a
  # exceção permitida. Toda medida acústica continua no servidor.
  record: ^7.1.1

  # Onde guardar os WAV gravados. O `record` exige um caminho de arquivo, e a
  # pasta certa é a área PRIVADA do aplicativo, que o Dart puro não sabe
  # encontrar: `getApplicationSupportDirectory` devolve essa pasta no Android
  # e no Windows. A pasta temporária do sistema não serve — o sistema pode
  # limpá-la antes de a gravação subir para a análise, e é dado clínico que
  # não se repete. Pacote oficial do time do Flutter.
  path_provider: ^2.1.6

  # Gráfico de evolução das medidas entre sessões (US09). É o pacote que a
  # stack do projeto já prevê (CLAUDE.md). Declara Android e Windows e é
  # Dart puro, sem código nativo.
  #
  # NÃO desenha sinal: espectrograma e forma de onda continuam chegando como
  # imagem pronta do servidor. Aqui ele só liga meia dúzia de números — um
  # por sessão — que a API já calculou.
  fl_chart: ^1.2.0

  # Laudo em PDF, montado no próprio aplicativo (US10). Decisão registrada:
  # gerar no app, e não no servidor, para funcionar sem conexão depois que o
  # resultado já chegou.
  #
  # `pdf`: Dart puro, licença Apache 2.0 — não é GPL, e pode ir dentro do
  # executável. Monta o documento; não toca em áudio.
  #
  # `printing`: pré-visualização do A4, folha de compartilhar e diálogo de
  # impressão, em Android e Windows com o mesmo código. Licença Apache 2.0. No
  # Windows, o build baixa o pdfium (BSD) para rasterizar a pré-visualização.
  pdf: ^3.13.1
  printing: ^5.15.1

  # Ouvir as gravações (US13). Só REPRODUZ o arquivo: não analisa nem desenha
  # nada — toda medida continua no servidor. Licença MIT.
  #
  # SUBSTITUIU o `just_audio` + `just_audio_windows` em 24/09/2026. Motivo: o
  # `just_audio` não cobre o Windows sozinho, e a implementação de Windows que
  # existia, o `just_audio_windows`, inclui `<experimental/coroutine>` — header
  # que o MSVC 14.51 (Visual Studio 2026) rejeita com STL1011. Como as imagens
  # do GitHub Actions passaram a trazer o VS 2026, o build do Windows parou de
  # fechar. A issue no upstream está aberta e sem correção.
  #
  # O `audioplayers` é federado pela PRÓPRIA organização que o mantém: o
  # `audioplayers_windows` é endossado no pubspec dele (`default_package`),
  # não é plugin de terceiro pendurado à parte. Foi esse o critério de
  # escolha. O candidato mais direto, `just_audio_windows_plus`, é drop-in e
  # resolveria sem mexer em código Dart, mas tinha 11 dias de publicação e 2
  # likes — e o que nos trouxe até aqui foi justamente depender de um plugin
  # federado pequeno, de mantenedor único, que ficou sem manutenção.
  #
  # O `just_audio_media_kit` segue barrado: embute a libmpv, que é GPL, e
  # trazer GPL para dentro do executável é o que o CLAUDE.md proíbe.
  #
  # A troca custou UM arquivo — `reproducao/data/reprodutor_audioplayers.dart`
  # — porque a reprodução está atrás da interface `Reprodutor`. O contrato não
  # mudou: tela e controlador não souberam da troca.
  audioplayers: ^6.8.1

  # O token de autenticação no cofre do sistema (US18): cifrado com chave do
  # Keystore no Android e com chave no Gerenciador de Credenciais no Windows.
  # O CLAUDE.md não deixa distribuir com o token em memória nem em
  # `SharedPreferences` — é a chave de acesso a dado de saúde. Licença BSD-3;
  # guarda texto, não mexe com áudio. Exige o backup automático do Android
  # desligado (ver o AndroidManifest.xml).
  flutter_secure_storage: ^11.2.0

  # Banco local (US14): pacientes, consentimentos, fila, CAPE-V e laudos
  # sobrevivem ao app fechado. É o que a stack do projeto já prevê (CLAUDE.md)
  # — a fila de sincronização precisa estar no disco para a gravação feita
  # sem rede subir depois.
  #
  # `drift_flutter` só abre o arquivo no lugar certo e numa isolate separada,
  # para consulta nenhuma travar a tela. O SQLite vem junto pelo `sqlite3`
  # 3.x (domínio público), igual no Android e no Windows. Nenhum dos dois
  # analisa áudio: guardam texto, datas e o caminho dos WAV.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  vector_graphics_compiler: ^1.3.0

  # Geram o código do banco a partir das tabelas (`lib/core/banco/`). O
  # gerado é commitado; o CI gera de novo e acusa se estiver desatualizado.
  # Não entram no aplicativo.
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets de ícone: apenas os binários PRÉ-COMPILADOS entram no bundle.
  #
  # Os .svg de `assets/icons/` são FONTE DE BUILD, não asset de runtime: são
  # convertidos em `.svg.vec` pelo vector_graphics_compiler (ver
  # `tool/compilar_icones.dart`). Parsear XML em runtime custa tempo no primeiro
  # frame de cada ícone; o formato .vec já vem pronto para rasterizar.
  #
  # Ao adicionar um ícone: coloque o .svg em `assets/icons/`, registre no enum
  # `NomeIcone` e rode `dart run tool/compilar_icones.dart`. O teste
  # `test/design_system/app_icone_test.dart` falha se algum desses passos faltar.
  assets:
    - assets/icons_vec/
    # O texto da licença da Urbanist vai junto da fonte, como a OFL pede. É
    # lido por `lib/app/licencas.dart` e aparece em "Licenças de software".
    - assets/fonts/OFL.txt

  # Urbanist — família única do FONAR, licença OFL (ver assets/fonts/OFL.txt).
  #
  # Embutida no aplicativo, não baixada em runtime. Gravação funciona offline
  # em consultório sem sinal; fonte que depende de rede vira texto sem estilo
  # exatamente na hora em que o profissional está com o paciente ao lado.
  #
  # Só quatro pesos, e é de propósito: 400 corpo, 600 rótulo, 700 título,
  # 800 medida acústica. Cada peso extra são ~73 KB no bundle para uma
  # distinção que o olho não faz a 1 m de distância. Itálico não entra —
  # não há uso previsto e ênfase no FONAR é por peso.
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
